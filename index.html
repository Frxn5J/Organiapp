<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="Administra tu dinero mediante categorías usando sobres virtuales" />
    <meta name="theme-color" content="#10b981" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="manifest" href="https://progressier.app/NFKPFGTueNPwPPsofHzf/progressier.json"/><script defer src="https://progressier.app/NFKPFGTueNPwPPsofHzf/script.js"></script>
    <link rel="preload" as="image" href="/splash.png" />
    <title>OrganiAPP</title>
    <style>#static-splash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#faf7fd;padding:24px}#static-splash img{max-width:min(72vw,420px);max-height:min(72vh,520px);width:auto;height:auto;object-fit:contain;display:block}#static-splash.out{animation:spOut .42s ease forwards}@keyframes spOut{from{opacity:1}to{opacity:0}}#static-splash .sp-check{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:rgba(20,30,40,.78);color:#fff;font:600 13px/1 system-ui,sans-serif;padding:9px 14px;border-radius:99px;backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .22s}#static-splash.checking .sp-check{opacity:1}#static-splash .sp-dot{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spSpin .7s linear infinite;flex:0 0 14px}#static-splash .sp-check.ok .sp-dot{border:none;animation:none;width:14px;height:14px;background:#10b981;display:grid;place-items:center;font-size:10px}@keyframes spSpin{to{transform:rotate(360deg)}}</style>
  </head>
  <body>
    <div id="static-splash"><img src="/splash.png" alt="" /><div class="sp-check" id="sp-check"><span class="sp-dot" id="sp-dot"></span><span id="sp-check-txt">Buscando actualizaciones…</span></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      (function(){
        var s=document.getElementById('static-splash');
        var txt=document.getElementById('sp-check-txt');
        var dot=document.getElementById('sp-dot');
        var chk=document.getElementById('sp-check');
        if(!s) return;
        var done=false, allowHide=false, pendingReload=false;
        window.__splashAllowHide=function(){ allowHide=true; if(!pendingReload) hideSoon(); };
        window.__splashHasUpdate=function(){ pendingReload=true; if(txt) txt.textContent='Actualizando…'; s.classList.add('checking'); };
        function hideSoon(ms){
          if(done || !allowHide || pendingReload) return;
          done=true;
          s.classList.add('out');
          setTimeout(function(){ s.remove(); }, 440);
        }
        function showChecking(){
          if(done || pendingReload) return;
          s.classList.add('checking');
        }
        s.addEventListener('click', function(){ if(allowHide && !pendingReload) hideSoon(); });
        showChecking();
        setTimeout(function(){ window.__splashAllowHide(); }, 1600);
        setTimeout(function(){ if(!done && !pendingReload) window.__splashAllowHide(); }, 3500);
        window.addEventListener('message', function(e){
          if(e.data==='sw-update-ready') window.__splashHasUpdate();
        });
      })();
    </script>
  </body>
</html>

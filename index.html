<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="Administra tu dinero mediante categorías usando sobres virtuales" />
    <meta name="theme-color" content="#10b981" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" as="image" href="/splash.png" />
    <title>OrganiAPP</title>
    <style>#static-splash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#faf7fd;padding:24px}#static-splash img{max-width:min(72vw,420px);max-height:min(72vh,520px);width:auto;height:auto;object-fit:contain;display:block}#static-splash.out{animation:spOut .42s ease forwards}@keyframes spOut{from{opacity:1}to{opacity:0}}</style>
  </head>
  <body>
    <div id="static-splash"><img src="/splash.png" alt="" /></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      (function(){
        var s=document.getElementById('static-splash');
        if(!s) return;
        var done=false;
        function hide(){
          if(done) return; done=true;
          s.classList.add('out');
          setTimeout(function(){ s.remove(); }, 440);
        }
        s.addEventListener('click', hide);
        setTimeout(hide, 1500);
      })();
    </script>
  </body>
</html>

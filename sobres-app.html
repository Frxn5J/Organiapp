<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sobres · Organiza tu dinero en sobres</title>
<style>
:root{
  --bg:          oklch(98% 0.004 240);
  --surface:     oklch(100% 0 0);
  --fg:          oklch(20% 0.02 240);
  --muted:       oklch(50% 0.018 240);
  --border:      oklch(90% 0.006 240);
  --accent:      oklch(56% 0.12 170);
  --accent-strong: oklch(45% 0.11 170);
  --accent-strong-hover: oklch(38% 0.11 170);
  --accent-soft: oklch(95% 0.04 170);
  --danger:      oklch(50% 0.18 25);
  --danger-soft: oklch(96% 0.03 25);
  --warn:        oklch(48% 0.13 80);
  --warn-soft:   oklch(95% 0.05 80);
  --ok:          oklch(45% 0.12 155);
  --ok-soft:     oklch(95% 0.04 155);
  --radius:      14px;
  --radius-sm:   10px;
  --shadow:      0 1px 2px rgba(20,30,40,.05), 0 10px 28px -16px rgba(20,30,40,.18);
  --font-display:'Söhne','Avenir Next',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --font-body:   -apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;
  --font-mono:   ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--fg);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit;color:var(--fg)}
::selection{background:var(--accent-soft)}
:focus-visible{outline:2px solid var(--accent-strong);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ---------- Shell ---------- */
.shell{min-height:100vh}
.sidebar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:var(--surface);
  border-top:1px solid var(--border);
  box-shadow:0 -14px 32px -20px rgba(20,30,40,.28);
  padding:6px 12px calc(6px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;justify-content:center;
}
.brandbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.brand-dot{width:32px;height:32px;border-radius:9px;background:var(--accent-strong);display:grid;place-items:center;color:#fff}
.brand-dot svg{width:16px;height:16px}
.brand-name{font-family:var(--font-display);font-weight:800;font-size:19px;letter-spacing:-.02em}
.nav{display:flex;gap:4px;width:100%;max-width:520px}
.nav a{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  flex:1;min-height:56px;padding:7px 6px;border-radius:14px;
  color:var(--muted);text-decoration:none;font-weight:600;font-size:11px;
  border:1px solid transparent;transition:background .15s,color .15s;text-align:center;
}
.nav a svg{width:22px;height:22px}
.nav a:hover{background:var(--bg);color:var(--fg)}
.nav a.active{background:var(--accent-soft);color:var(--accent-strong)}
.sideFoot{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.side-chip{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.side-chip b{color:var(--fg);font-weight:700}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);font-family:var(--font-mono)}
.pill i{width:6px;height:6px;border-radius:50%;background:var(--accent)}

/* ---------- Content ---------- */
.content{min-width:0;padding:30px 34px 116px;max-width:1180px;margin:0 auto;width:100%}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:26px}
.topbar h1{font-family:var(--font-display);font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.topbar p{color:var(--muted);font-size:14.5px;margin-top:4px;max-width:560px}
.eyebrow{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--accent-strong);font-weight:600;margin-bottom:8px}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:8px;justify-content:center;
  font-weight:700;font-size:14.5px;border-radius:var(--radius-sm);
  padding:11px 18px;border:1px solid transparent;transition:background .15s,border-color .15s,color .15s,transform .05s;
  min-height:44px;white-space:nowrap;
}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent-strong);color:#fff}
.btn-primary:hover{background:var(--accent-strong-hover)}
.btn-primary:disabled{background:var(--border);color:var(--muted);cursor:not-allowed}
.btn-ghost{background:var(--surface);border-color:var(--border);color:var(--fg)}
.btn-ghost:hover{border-color:oklch(82% 0.01 240);background:var(--bg)}
.btn-soft{background:var(--accent-soft);color:var(--accent-strong)}
.btn-soft:hover{background:oklch(93% 0.05 170)}
.btn-danger{background:transparent;border-color:var(--border);color:var(--danger)}
.btn-danger:hover{border-color:var(--danger);background:var(--danger-soft)}
.btn-link{background:none;border:none;color:var(--accent-strong);font-weight:700;padding:8px;min-height:auto}
.btn-link:hover{text-decoration:underline}
.btn-sm{padding:8px 14px;min-height:44px;font-size:13.5px}

/* ---------- Cards ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.card-t{font-family:var(--font-display);font-weight:700;font-size:16px;letter-spacing:-.01em;display:flex;align-items:center;justify-content:space-between;gap:10px}
.card-s{font-size:13px;color:var(--muted);margin-top:2px}

/* ---------- Summary grid ---------- */
.sum-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
.sum-card{position:relative;overflow:hidden}
.sum-card.hero{background:var(--accent-soft);border-color:oklch(90% 0.05 170)}
.sum-label{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:7px}
.sum-label svg{width:15px;height:15px}
.sum-val{font-family:var(--font-mono);font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:8px;line-height:1}
.sum-sub{font-size:12.5px;color:var(--muted);margin-top:7px}

/* ---------- Split bar ---------- */
.split-wrap{margin-bottom:16px}
.split-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.split-title .card-t{font-size:15px}
.split{display:flex;height:34px;border-radius:var(--radius-sm);overflow:hidden;margin:14px 0 12px;border:1px solid var(--border)}
.split i{height:100%;min-width:8px;transition:flex-grow .3s;position:relative}
.split i:hover{filter:brightness(1.06)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px}
.lg{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted)}
.lg b{font-family:var(--font-mono);color:var(--fg);font-weight:700}
.lg i{width:10px;height:10px;border-radius:3px;flex:0 0 10px}

/* ---------- Spending view ---------- */
.sp-bars{display:flex;flex-direction:column;gap:16px}
.sp-row{display:flex;align-items:center;gap:12px}
.sp-row .env-ico{width:34px;height:34px;flex-basis:34px;border-radius:10px}
.sp-row .sp-info{flex:1;min-width:0}
.sp-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:7px;font-size:13.5px}
.sp-name{font-weight:700}
.sp-amt{font-family:var(--font-mono);font-weight:700;font-variant-numeric:tabular-nums}
.sp-pct{font-family:var(--font-mono);font-size:12.5px;color:var(--muted);min-width:40px;text-align:right}
.sp-bar{height:10px;background:var(--bg);border-radius:99px;overflow:hidden}
.sp-bar i{display:block;height:100%;border-radius:99px;transition:width .4s}

/* ---------- Envelope grid ---------- */
.env-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:16px}
.env{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;text-align:left;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:14px;
  transition:border-color .15s,transform .15s,box-shadow .15s;min-height:44px;
}
.env:hover{border-color:oklch(82% 0.01 240);transform:translateY(-2px);box-shadow:0 1px 2px rgba(20,30,40,.05),0 16px 34px -18px rgba(20,30,40,.22)}
.env-top{display:flex;align-items:center;gap:12px}
.env-ico{width:42px;height:42px;border-radius:12px;background:var(--t);color:var(--c);display:grid;place-items:center;flex:0 0 42px}
.env-ico svg{width:21px;height:21px}
.env-name{font-family:var(--font-display);font-weight:700;font-size:15.5px}
.env-meta{font-size:12px;color:var(--muted);margin-top:1px}
.env-bal{margin-left:auto;font-family:var(--font-mono);font-weight:800;font-size:18px;letter-spacing:-.02em}
.env-bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden}
.env-bar i{display:block;height:100%;border-radius:99px;transition:width .4s}
.env-foot{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted)}
.env-foot strong{font-family:var(--font-mono);font-weight:700;color:var(--fg)}

/* ---------- Banners ---------- */
.banner{display:flex;gap:12px;align-items:flex-start;border-radius:var(--radius);padding:14px 16px;font-size:14px;border:1px solid transparent}
.banner svg{width:20px;height:20px;flex:0 0 20px;margin-top:1px}
.banner-ok{background:var(--ok-soft);border-color:oklch(88% 0.06 155);color:var(--ok)}
.banner-warn{background:var(--warn-soft);border-color:oklch(88% 0.08 80);color:var(--warn)}
.banner-danger{background:var(--danger-soft);border-color:oklch(90% 0.06 25);color:var(--danger)}
.banner strong{display:block;font-weight:800;margin-bottom:2px}

/* ---------- Table ---------- */
.tbl-wrap{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:12px 18px;background:var(--bg);font-weight:600}
td{padding:13px 18px;border-top:1px solid var(--border);vertical-align:middle}
td.num,th.num{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
tr.total td{border-top:2px solid var(--border);font-weight:800;background:var(--bg)}
.cell-env{display:flex;align-items:center;gap:10px;font-weight:700}
.cell-env i{width:22px;height:22px;border-radius:7px;color:var(--c);background:var(--t);display:grid;place-items:center;flex:0 0 22px}
.cell-env i svg{width:13px;height:13px}

/* ---------- Calculator config ---------- */
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:3px;gap:2px}
.seg button{border:none;background:none;padding:8px 16px;border-radius:8px;font-weight:700;font-size:13.5px;color:var(--muted);min-height:36px}
.seg button.active{background:var(--surface);color:var(--accent-strong);box-shadow:0 1px 3px rgba(20,30,40,.12)}
.rows{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end;margin-top:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input{
  border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 13px;font-size:15px;
  background:var(--surface);min-height:44px;width:200px;
}
.field input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.field.hint input{width:260px}
.hint{font-size:12px;color:var(--muted)}
.hint strong{color:var(--fg);font-family:var(--font-mono)}

/* ---------- How it's calculated ---------- */
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;border-top:1px solid var(--border);padding-top:20px}
.how-step{padding:0}
.how-step b{font-family:var(--font-display);display:block;font-size:14.5px;margin-bottom:4px}
.how-step span{font-size:13px;color:var(--muted);display:block;line-height:1.55}
.how-step .freq{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent-strong);font-weight:700;margin-bottom:8px;display:block}

/* ---------- Onboarding · Organibot ---------- */
.onb-wrap{max-width:680px;margin:0 auto}
.chat{background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.chat-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border);background:var(--bg)}
.chat-head .bot-ico{width:38px;height:38px;border-radius:12px;background:var(--accent-soft);color:var(--accent-strong);display:grid;place-items:center}
.chat-head .bot-ico svg{width:20px;height:20px}
.chat-head .tt{font-family:var(--font-display);font-size:15px;font-weight:800}
.chat-head .st{font-size:12px;color:var(--muted)}
.chat-body{padding:22px;display:flex;flex-direction:column;gap:14px;max-height:min(560px,62vh);overflow-y:auto}
.msg{display:flex;gap:10px;max-width:94%}
.msg .av{width:30px;height:30px;border-radius:10px;background:var(--accent-soft);color:var(--accent-strong);display:grid;place-items:center;flex:0 0 30px}
.msg .av svg{width:15px;height:15px}
.msg .bub{background:var(--bg);border:1px solid var(--border);border-radius:14px;border-top-left-radius:4px;padding:12px 15px;font-size:14px;line-height:1.5}
.msg .bub b{color:var(--accent-strong)}
.msg .bub .memo{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.msg.bot .bub{flex:1;min-width:0}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg.user .bub{background:var(--accent);color:#fff;border:none;border-radius:14px;border-top-right-radius:4px}
.msg.user .bub .memo{color:oklch(96% 0.02 170 / .85)}
.msg .tool{display:flex;flex-wrap:wrap;gap:9px;margin-top:11px}
.msg .tool .btn{font-size:13px;padding:10px 14px;min-height:44px}
.msg .tool.tc{flex-direction:column;align-items:stretch}
.msg .tool .row{display:flex;gap:9px}
.msg .tool .row .btn{flex:1}
.msg .fld{display:flex;gap:9px;margin-top:11px}
.msg .fld input[type=text]{flex:1;min-width:0;border:1.5px solid var(--border);border-radius:10px;padding:11px 14px;font-size:14px;font-family:var(--font-base);background:var(--surface)}
.msg .fld input[type=text]:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.msg .fld .btn{min-width:56px}
.radios{display:flex;gap:10px;flex-wrap:wrap}
.radio{position:relative;display:block}
.radio input{position:absolute;opacity:0;inset:0;cursor:pointer}
.radio span{display:flex;align-items:center;gap:9px;border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:13px 18px;font-weight:700;font-size:14.5px;color:var(--muted);transition:all .15s;min-height:44px}
.radio input:checked+span{border-color:var(--accent);color:var(--accent-strong);background:var(--accent-soft)}
.radio input:focus-visible+span{outline:2px solid var(--accent-strong);outline-offset:2px}
.cat-form{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.cf-name input{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:11px 14px;font-size:14px;font-family:var(--font-base);background:var(--surface)}
.cf-name input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.cf-pick{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cf-pick .pv{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:0 0 44px;background:var(--accent-soft);color:var(--accent-strong)}
.cf-pick .pv svg{width:22px;height:22px}
.cf-pick .pv.sw{background:var(--c);color:var(--surface)}
.cf-pick select{flex:1;min-width:0;min-height:44px;border:1.5px solid var(--border);border-radius:10px;padding:0 10px;font-size:14px;font-family:var(--font-base);background:var(--surface);color:var(--fg);cursor:pointer}
.cf-pick select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.cf-max{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cf-max label{font-size:13.5px;color:var(--muted)}
.cf-max input{width:130px;border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;font-family:var(--font-mono);font-size:14px;text-align:right;background:var(--surface)}
.cf-max input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.cf-add{display:flex;gap:9px;align-items:center}
.cf-add .btn{flex:1}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--bg);border:1px solid var(--border);border-radius:99px;padding:7px 12px;font-size:13px;font-weight:600}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.chip b{font-family:var(--font-mono);font-weight:700}
.chip button{width:18px;height:18px;border:none;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center;padding:0}
.chip button:hover{color:var(--fg)}
.sw-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:12px}
.sw{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;border:none;background:none;padding:0}
.sw i{width:42px;height:42px;border-radius:13px;background:var(--c);border:3px solid transparent;transition:all .15s}
.sw span{font-size:11px;color:var(--muted);font-weight:600}
.sw.on i{border-color:var(--fg);box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--c)}
.sw.on span{color:var(--fg)}
.chat-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--bg)}
.chat-foot .demo{font-size:12.5px;color:var(--muted)}
.chat-foot .demo b{color:var(--accent-strong);cursor:pointer;font-weight:700}

/* ---------- Cat list (settings) ---------- */
.cat-list{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.cat-item{display:flex;align-items:center;gap:12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;transition:border-color .15s,background .15s}
.cat-item.inactive{opacity:.55}
.cat-ico{width:34px;height:34px;border-radius:10px;background:var(--t);color:var(--c);display:grid;place-items:center;flex:0 0 34px}
.cat-ico svg{width:17px;height:17px}
.cat-info{flex:1;min-width:0}
.cat-name{font-weight:700;font-size:14px}
.cat-sub{font-size:11.5px;color:var(--muted)}
.cat-item input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent-strong);flex:0 0 18px}
.cat-item input[type=number]{width:104px;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-family:var(--font-mono);font-size:14px;text-align:right}
.cat-item input[type=number]:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}

/* ---------- Modal ---------- */
.modal{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:20px}
.modal[hidden]{display:none}
.modal-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:24px}
.modal-card h3{font-family:var(--font-display);font-size:18px;font-weight:800;margin-bottom:4px}
.modal-card .lead{font-size:13px;color:var(--muted);margin-bottom:18px}
.modal-card .field{margin-bottom:14px}
.modal-card .field label{display:block;font-size:12.5px;font-weight:700;margin-bottom:6px;color:var(--muted)}
.modal-card input[type=number],.modal-card input[type=text]{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:11px 14px;font-size:14px;background:var(--surface)}
.modal-card input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.modal-card input[type=number]{font-family:var(--font-mono)}
.modal-actions{display:flex;gap:10px;margin-top:6px}
.modal-actions .btn{flex:1}

/* ---------- Drawer ---------- */
.scrim{position:fixed;inset:0;background:oklch(20% 0.02 240 / .35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:430px;max-width:92vw;
  background:var(--surface);z-index:50;box-shadow:-18px 0 48px -24px rgba(20,30,40,.35);
  transform:translateX(105%);transition:transform .25s ease;
  display:flex;flex-direction:column;
}
.drawer.show{transform:translateX(0)}
.drawer-head{display:flex;align-items:center;gap:12px;padding:20px 22px;border-bottom:1px solid var(--border)}
.drawer-head .env-ico{width:40px;height:40px;flex-basis:40px}
.drawer-head h3{font-family:var(--font-display);font-size:18px;font-weight:800;letter-spacing:-.01em}
.drawer-body{flex:1;overflow-y:auto;padding:20px 22px;display:flex;flex-direction:column;gap:18px}
.drawer-close{margin-left:auto;width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:none;color:var(--muted);display:grid;place-items:center}
.drawer-close:hover{background:var(--bg);color:var(--fg)}
.d-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.d-stat{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px}
.d-stat label{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-family:var(--font-mono);display:block}
.d-stat b{font-family:var(--font-mono);font-size:15px;font-weight:800;display:block;margin-top:3px}
.d-actions{display:flex;gap:10px}
.d-actions .btn{flex:1}
.tx-list{display:flex;flex-direction:column;gap:8px}
.tx{display:flex;align-items:center;gap:12px;padding:11px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface)}
.tx-ico{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:0 0 32px}
.tx-ico.spend{background:var(--danger-soft);color:var(--danger)}
.tx-ico.fund{background:var(--ok-soft);color:var(--ok)}
.tx-ico svg{width:15px;height:15px}
.tx-info{flex:1;min-width:0}
.tx-note{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-date{font-size:11.5px;color:var(--muted)}
.tx-amt{font-family:var(--font-mono);font-weight:800;font-size:14.5px}
.tx-amt.minus{color:var(--danger)}
.tx-amt.plus{color:var(--ok)}
.empty{text-align:center;color:var(--muted);font-size:13.5px;padding:26px 0;border:1px dashed var(--border);border-radius:var(--radius-sm)}
.mini-form{display:flex;flex-direction:column;gap:12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px}
.mini-form .row{display:flex;gap:10px;align-items:center}
.mini-form input[type=number]{width:130px;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-family:var(--font-mono);font-size:15px}
.mini-form input[type=text]{flex:1;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:14px;min-width:0}
.mini-form input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.form-err{font-size:12.5px;color:var(--danger);font-weight:600}
.form-ok{font-size:12.5px;color:var(--ok);font-weight:600}

/* ---------- Toast ---------- */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,24px);
  background:var(--fg);color:var(--surface);border-radius:var(--radius-sm);
  padding:13px 20px;font-size:14px;font-weight:600;box-shadow:var(--shadow);
  opacity:0;transition:all .25s ease;z-index:60;max-width:min(92vw,480px);text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Animations ---------- */
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.018)}100%{transform:scale(1)}}
.pop{animation:pop .5s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.view{animation:fadeUp .25s ease}

/* ---------- Responsive ---------- */
@media (max-width:920px){
  .content{padding:22px 16px 104px}
  .brandbar{flex-direction:column;align-items:flex-start;gap:8px}
  .sum-grid{grid-template-columns:1fr}
  .how{grid-template-columns:1fr;gap:18px}
  .cat-list{grid-template-columns:1fr}
  .sw-grid{grid-template-columns:repeat(4,1fr)}
  .topbar{flex-direction:column}
  .topbar .btn{width:100%}
  table{display:block}
  thead{display:none}
  tbody{display:block}
  tr{display:block;padding:6px 14px}
  td{display:flex;justify-content:space-between;gap:10px;border:none;padding:8px 0}
  tr.total td{justify-content:space-between}
  .cell-env{justify-content:flex-start}
  td.num{text-align:right}
}

/* ---------------- State ---------------- */

var STORAGE_KEY = 'sobres-app-v2';
var state;
function load(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return null;
    var s = JSON.parse(raw);
    if(!s || !Array.isArray(s.envelopes)) return null;
    if(s.appColor==null) s.appColor='teal';
    if(s.name==null) s.name='';
    if(s.varIncome==null) s.varIncome=false;
    if(s.varTotal==null) s.varTotal=0;
    if(s.colorChosen==null) s.colorChosen=false;
    if(s.onbStep==null) s.onbStep=0;
    if(!Array.isArray(s.onbMsgs)) s.onbMsgs=[];
    for(var i=0;i<s.envelopes.length;i++){
      var e = s.envelopes[i];
      if(e.color==null && LEGACY[e.id]){ e.name=LEGACY[e.id].name; e.icon=LEGACY[e.id].icon; e.color=LEGACY[e.id].c; e.tint=LEGACY[e.id].t; }
      if(e.balance==null) e.balance=0;
      if(!Array.isArray(e.txns)) e.txns=[];
    }
    return s;
  }catch(e){ return null; }
}
function save(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){} }
function applyAppColor(){
  var col = colorOf(state.appColor);
  var r = document.documentElement.style;
  r.setProperty('--accent', col.a);
  r.setProperty('--accent-strong', col.s);
  r.setProperty('--accent-strong-hover', col.h);
  r.setProperty('--accent-soft', col.soft);
}
state = load() || buildFresh();

var drawerId = null;
var miniMode = 'gasto';

/* ---------------- Router ---------------- */

function go(view){
  state.view = view; save();
  var nav = document.querySelectorAll('.nav a');
  for(var i=0;i<nav.length;i++){ nav[i].classList.toggle('active', nav[i].getAttribute('data-nav')===view); }
  var views = ['spending','dashboard','calculator','settings','onboarding'];
  for(var j=0;j<views.length;j++){ document.getElementById('view-'+views[j]).hidden = (views[j]!==view); }
  if(view==='spending') renderSpending();
  if(view==='dashboard') renderDashboard();
  if(view==='calculator') renderCalculator();
  if(view==='settings') renderSettings();
  if(view==='onboarding') renderOnboarding();
  closeDrawer();
}

function renderTopbar(title, sub){
  document.getElementById('topbar').innerHTML = '<div><h1>'+esc(title)+'</h1><p>'+esc(sub)+'</p></div>';
}
function renderSidebarFoot(){
  var el = document.getElementById('sideFoot');

/* ---------------- Income ---------------- */

function receiveIncome(){
  if(state.received >= state.ingresoMensual - 0.01){ toast('Ya recibiste tus pagos de este mes'); return; }
  var total = totalContrib();
  var t = today();
  for(var i=0;i<state.envelopes.length;i++){
    var e = state.envelopes[i]; if(!e.on) continue;
    var c = contrib(e);
    e.balance += c;
    e.txns.unshift({kind:'aporte', amount:c, note:'Aporte de nómina', date:t});
  }
  state.received = Math.min(state.received + incomePerPay(), state.ingresoMensual);
  save();
  renderDashboard();
  var grid = document.getElementById('envGrid');
  if(grid){ grid.classList.remove('pop'); void grid.offsetWidth; grid.classList.add('pop'); }
  toast('Ingreso registrado · '+fmt(total)+' repartidos en tus sobres');
}

/* ---------------- Drawer ---------------- */

function openDrawer(id){
  drawerId = id;
  document.getElementById('drawer').setAttribute('aria-hidden','false');
  document.getElementById('drawer').classList.add('show');
  document.getElementById('scrim').classList.add('show');
  renderDrawer();

function closeDrawer(){
  drawerId = null;

  document.getElementById('drawer').setAttribute('aria-hidden','true');
}

function renderDrawer(){

function setMini(m){ miniMode = m; renderDrawer(); }

function validateMini(){
  var msg = document.getElementById('miniMsg'); if(!msg) return;
  var input = document.getElementById('miniAmt');
  var submit = document.getElementById('miniSubmit');
  var raw = input.value;
  var amt = parseFloat(raw);
  if(!raw || !(amt>0)){ msg.hidden = true; submit.disabled = true; return; }
  if(miniMode==='gasto' && amt > getEnv(drawerId).balance){
    msg.textContent = 'No hay suficiente saldo. Ajusta el monto o aporta más a este sobre.';
    msg.hidden = false; submit.disabled = true; return;
  }
  msg.hidden = true; submit.disabled = false;
}

function submitMini(){
  var amt = parseFloat(document.getElementById('miniAmt').value);
  var note = document.getElementById('miniNote').value.trim() || (miniMode==='gasto' ? 'Gasto en '+envName(getEnv(drawerId)) : 'Aporte manual');
  if(!(amt>0)){ validateMini(); return; }
  var e = getEnv(drawerId);
  if(miniMode==='gasto' && amt>e.balance){ validateMini(); return; }
  e.txns.unshift({kind: miniMode==='gasto' ? 'gasto':'aporte', amount: Math.round(amt), note: note, date: today() });
  e.balance = miniMode==='gasto' ? e.balance - Math.round(amt) : e.balance + Math.round(amt);
  save();
  renderDrawer();
  toast(miniMode==='gasto' ? 'Gasto registrado' : 'Dinero aportado al sobre');
}

      '<div><strong>Tus sobres piden más de lo que cobras</strong>'+
      'Destinas '+fmt(total)+' '+FREQ[state.freq].period+', pero recibes '+fmt(income)+'. '+
      'Reduce tus máximos en al menos <b>'+fmt(over)+'</b> para que el plan cuadre.</div></div>';

      '<div><strong>Tu plan cuadra</strong>'+

  }
  return '<div class="banner banner-warn" data-od-id="banner-exact">'+
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>'+
    '<div><strong>Lo usas todo</strong>Destinas exactamente lo que recibes y no queda margen de maniobra.</div></div>';
}

function renderCalculator(){
  renderTopbar('Planificador','Calcula cuánto debes apartar en cada pago para cubrir tus gastos máximos.');
  var i;
  var seg = '';
  var keys = ['mensual','quincenal','semanal'];
  for(i=0;i<keys.length;i++){
    seg += '<button data-od-id="freq-'+keys[i]+'" class="'+(state.freq===keys[i]?'active':'')+'" onclick="setFreq(\''+keys[i]+'\')">'+FREQ[keys[i]].label+'</button>';
  }

  var rows = '';
  for(i=0;i<state.envelopes.length;i++){
    var e = state.envelopes[i]; if(!e.on) continue;
    var ec = envColor(e);
    rows += '<tr data-od-id="calc-row-'+e.id+'">'+
      '<td><div class="cell-env"><i style="--c:'+ec.c+';--t:'+ec.t+'">'+icon(envIconId(e))+'</i>'+esc(envName(e))+'</div></td>'+
      '<td class="num">'+fmt(e.max)+'</td>'+
      '<td class="num">'+fmt(contrib(e))+'</td>'+
    '</tr>';
  }
  var total = totalContrib();
  var fit = fitBannerHtml(total);

  document.getElementById('view-calculator').innerHTML =
    '<div class="card" style="margin-bottom:16px" data-od-id="card-calc-config">'+
      '<div class="card-t">Tu ingreso</div><div class="card-s">¿Cada cuánto cobras? Ajustamos las aportaciones automáticamente.</div>'+
      '<div class="rows">'+
        '<div class="field"><label>Cada cuánto cobras</label>'+'<div class="seg">'+seg+'</div></div>'+
        '<div class="field hint"><label>Ingreso por pago</label><input type="number" id="calcIncome" min="0" step="any" value="'+Math.round(incomePerPay())+'" oninput="calcIncomeChanged(this.value)"><span class="hint" id="calcHint">Equivale a <strong>'+fmt(state.ingresoMensual)+'</strong> al mes</span></div>'+
      '</div>'+
    '</div>'+
    '<div id="calcFit" style="margin-bottom:16px">'+fit+'</div>'+
    '<div class="tbl-wrap" data-od-id="table-contributions">'+
      '<table>'+
        '<thead><tr><th>Sobre</th><th class="num">Gasto máximo mensual</th><th class="num">Aportación '+FREQ[state.freq].period+'</th></tr></thead>'+
        '<tbody>'+rows+'<tr class="total"><td>Total</td><td class="num">'+fmt(state.envelopes.filter(function(x){return x.on;}).reduce(function(s,e){return s+e.max;},0))+'</td><td class="num">'+fmt(total)+'</td></tr></tbody>'+
      '</table>'+
    '</div>'+
    '<div class="card-t" style="margin:22px 0 12px">Cómo se calcula</div>'+
    '<div class="how">'+
      '<div class="how-step" data-od-id="how-mensual"><span class="freq">Mensual</span><b>El máximo, de una vez</b><span>Si cobras una vez al mes, aportas el gasto máximo completo en ese único pago.</span></div>'+
      '<div class="how-step" data-od-id="how-quincenal"><span class="freq">Quincenal</span><b>La mitad cada quincena</b><span>Con dos pagos al mes, apartas la mitad del máximo en cada quincena.</span></div>'+
      '<div class="how-step" data-od-id="how-semanal"><span class="freq">Semanal</span><b>Repartido en ~4,3 semanas</b><span>Con pago semanal, divides el máximo entre las semanas del mes (máx × 12 ÷ 52).</span></div>'+
    '</div>';
}

function setFreq(f){
  state.freq = f; save();
  renderCalculator(); renderSidebarFoot();
  toast('Frecuencia: ' + FREQ[f].label.toLowerCase());
}
function calcIncomeChanged(v){
  var n = parseFloat(v);
  state.ingresoMensual = (n>0 && isFinite(n)) ? n*perMonth(state.freq) : 0;
  save();
  var h = document.getElementById('calcHint');
  if(h) h.innerHTML = 'Equivale a <strong>'+fmt(state.ingresoMensual)+'</strong> al mes';
  var fit = document.getElementById('calcFit');
  if(fit) fit.innerHTML = fitBannerHtml(totalContrib());
  renderSidebarFoot();
}

/* ---------------- Settings ---------------- */

function renderSettings(){
  renderTopbar('Ajustes','Tu perfil de ingreso y el tope de cada sobre. Los cambios se guardan en este navegador.');
  var keys = ['mensual','quincenal','semanal'];
  var seg = '';
  for(var i=0;i<keys.length;i++){
    seg += '<button data-od-id="setfreq-'+keys[i]+'" class="'+(state.freq===keys[i]?'active':'')+'" onclick="setFreq(\''+keys[i]+'\')">'+FREQ[keys[i]].label+'</button>';
  }
  var list = '';
  for(i=0;i<state.envelopes.length;i++){
    var e = state.envelopes[i]; var ec = envColor(e);
    list += '<div class="cat-item" data-od-id="set-env-'+e.id+'">'+
      '<input type="checkbox" data-env="'+e.id+'" '+(e.on?'checked':'')+' onchange="toggleEnv(\''+e.id+'\')" aria-label="Activar '+esc(envName(e))+'">'+
      '<span class="cat-ico" style="--c:'+ec.c+';--t:'+ec.t+'">'+icon(envIconId(e))+'</span>'+
      '<div class="cat-info"><div class="cat-name">'+esc(envName(e))+'</div><div class="cat-sub">Máximo mensual</div></div>'+
      '<input type="number" min="0" step="any" value="'+e.max+'" onchange="envMax(\''+e.id+'\',this.value)" aria-label="Máximo mensual de '+esc(envName(e))+'">'+
    '</div>';
  }
  document.getElementById('view-settings').innerHTML =
    '<div class="card" style="margin-bottom:16px" data-od-id="card-settings-income">'+
      '<div class="card-t">Tu ingreso</div><div class="card-s">Al cambiar la frecuencia, se recalculan todas las aportaciones.</div>'+
      '<div class="rows">'+
        '<div class="field"><label>Cada cuánto cobras</label><div class="seg">'+seg+'</div></div>'+
        '<div class="field hint"><label>Ingreso por pago</label><input type="number" id="setIncome" min="0" step="any" value="'+Math.round(incomePerPay())+'" oninput="setIncomeChanged(this.value)"><span class="hint" id="setHint">Equivale a <strong>'+fmt(state.ingresoMensual)+'</strong> al mes</span></div>'+
        '<div style="margin-top:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">'+
          '<label style="display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--muted);cursor:pointer;min-height:44px">'+
            '<input type="checkbox" id="setVar" '+(state.varIncome?'checked':'')+' onchange="toggleVar(this.checked)" style="width:20px;height:20px;accent-color:var(--accent-strong);flex:0 0 20px">'+
            '<span>¿Tienes ingresos variables?</span>'+
          '</label>'+
          '<span style="font-size:12px;color:var(--muted)">Activa el botón para registrar ventas, extras o freelance.</span>'+
        '</div>'+
      '</div>'+
    '</div>'+
    '<div class="card" style="margin-bottom:16px" data-od-id="card-settings-envelopes">'+
      '<div class="card-t">Tus sobres</div><div class="card-s">Marca o desmarca sobres y ajusta el gasto máximo de cada mes.</div>'+
      '<div class="cat-list" style="margin-top:16px;grid-template-columns:1fr">'+list+'</div>'+
    '</div>'+
    '<div class="card" data-od-id="card-settings-actions">'+
      '<div class="card-t">Reinicio</div><div class="card-s">Carga los datos de ejemplo o empieza el asistente desde cero.</div>'+
      '<div class="d-actions" style="margin-top:16px">'+
        '<button class="btn btn-ghost" onclick="loadDemo()">Restablecer ejemplo</button>'+
        '<button class="btn btn-danger" onclick="resetApp()">Empezar de cero</button>'+
      '</div>'+
    '</div>';
}
function toggleEnv(id){ var e=getEnv(id); e.on=!e.on; save(); }
function envMax(id,v){ var e=getEnv(id); var n=parseFloat(v); e.max=(n>0&&isFinite(n))?Math.round(n):0; save(); renderSidebarFoot(); }
function setIncomeChanged(v){ var n=parseFloat(v); state.ingresoMensual=(n>0&&isFinite(n))?n*perMonth(state.freq):0; save(); var h=document.getElementById('setHint'); if(h) h.innerHTML='Equivale a <strong>'+fmt(state.ingresoMensual)+'</strong> al mes'; renderSidebarFoot(); }
function loadDemo(){ state=buildDemo(); state.view='dashboard'; save(); go('dashboard'); toast('Datos de ejemplo restablecidos'); }
function resetApp(){ try{ localStorage.removeItem(STORAGE_KEY); }catch(e){} state=buildFresh(); save(); go('onboarding'); toast('Organibot te acompaña de nuevo'); }
function toggleVar(ch){ state.varIncome=!!ch; save(); renderSettings(); toast(ch?'Ingresos variables activados':'Ingresos variables desactivados'); }

/* ---------------- Variable income · Modal ---------------- */

function openVarModal(){
  document.getElementById('modal').hidden = false;
  document.getElementById('scrim').classList.add('show');
  setTimeout(function(){ var a=document.getElementById('varAmount'); if(a) a.focus(); },40);
}
function closeVarModal(){
  document.getElementById('modal').hidden = true;
  document.getElementById('scrim').classList.remove('show');
}
function submitVar(){
  var amountEl = document.getElementById('varAmount');
  var n = parseFloat(amountEl ? amountEl.value : '');
  if(!(n>0) || !isFinite(n)){ toast('Escribe un monto válido'); if(amountEl) amountEl.focus(); return; }
  var concept = document.getElementById('varConcept').value.trim() || 'Ingreso variable';
  var amt = Math.round(n*100)/100;
  state.varTotal = (state.varTotal||0) + amt;
  if(!Array.isArray(state.varTxns)) state.varTxns = [];
  state.varTxns.push({ amount:amt, note:concept, date:'hoy' });
  save();
  closeVarModal();
  if(state.view==='dashboard') renderDashboard();
  toast('Ingreso variable registrado');
}

/* ---------------- Onboarding · Organibot ---------------- */

var OB_AV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="11" rx="3"/><circle cx="9" cy="13" r="1"/><circle cx="15" cy="13" r="1"/><path d="M9 4l-3 2M15 4l3 2"/></svg>';
var obPick = { icon:'comida', color:'teal' };

function obBot(body){ return '<div class="msg bot"><div class="av">'+OB_AV+'</div><div class="bub">'+body+'</div></div>'; }
function obUser(txt){ return '<div class="msg user"><div class="bub">'+txt+'</div></div>'; }

function obTranscript(){
  var t = [];
  if(state.onbStep>=1){
    t.push(obBot('¡Hola! Soy <b>Organibot</b>, tu organizador personal de sobres. Te haré unas preguntas y en un par de minutos tendrás tu presupuesto listo.'));
    t.push(obBot('Empezamos. <b>¿Cómo te llamas?</b>'));
    t.push(obUser(esc(state.name)));
  }
  if(state.onbStep>=2){
    t.push(obBot('<b>'+esc(state.name)+',</b> ¿cada cuánto cobras?'));
    t.push(obUser(FREQ[state.freq].label+' · <b>'+fmt(state.ingresoMensual)+' €</b> al mes'));
  }
  if(state.onbStep>=3){
    t.push(obBot('¿Tus ingresos son variables?'));
    t.push(obUser(state.varIncome?'Sí, son variables':'No, son fijos'));
  }
  if(state.onbStep>=4){
    t.push(obBot('Ahora crea tus <b>categorías de gasto</b> con su máximo mensual.'));
    for(var i=0;i<state.envelopes.length;i++){
      var e = state.envelopes[i];
      t.push(obUser('<b>'+esc(envName(e))+'</b> · <b>'+fmt(e.max)+' €</b> <span class="memo">máximo al mes</span>'));
    }
  }
  if(state.onbStep>=5){
    t.push(obBot('¿De qué color quieres la app?'));
    t.push(obUser(colorOf(state.appColor).name));
  }
  return t;
}

function obPrompt(step){
  switch(step){
    case 0:
      return obBot('¡Hola! Soy <b>Organibot</b>, tu organizador personal de sobres. Te haré unas preguntas y en un par de minutos tendrás tu presupuesto listo.')+
        '<div class="msg bot"><div class="av">'+OB_AV+'</div><div class="bub"><div class="tool"><button class="btn btn-primary" data-od-id="onb-start" onclick="obGo(1)">¡Empecemos!</button></div></div></div>';
    case 1:
      return obBot('Empezamos. <b>¿Cómo te llamas?</b>')+
        '<div class="msg bot"><div class="av">'+OB_AV+'</div><div class="bub"><div class="fld"><input type="text" id="obName" maxlength="30" aria-label="Tu nombre"><button class="btn btn-primary" data-od-id="onb-name" onclick="obNameDone()">Siguiente</button></div></div></div>';
    case 2:
      var seg='';
      ['mensual','quincenal','semanal'].forEach(function(k){
        seg += '<label class="radio"><input type="radio" name="obFreq" value="'+k+'" '+(state.freq===k?'checked':'')+' onchange="obFreq(\''+k+'\')"><span>'+FREQ[k].label+'</span></label>';
      });
      return obBot('Perfecto. ¿Y cuánto recibes en <b>cada pago</b>?')+
        '<div class="msg bot"><div class="av">'+OB_AV+'</div><div class="bub">'+
          '<div class="radios">'+seg+'</div>'+
          '<div class="fld" style="margin-top:12px"><input type="text" id="obIncome" inputmode="decimal" aria-label="Ingreso por pago"><button class="btn btn-primary" data-od-id="onb-salary" onclick="obSalaryDone()">Listo</button></div>'+
          '<span class="memo">Ejemplo: si cobras 1800 € cada quincena, escribe 1800.</span>'+
        '</div></div>';
    case 3:
      return obBot('¿Tus ingresos son <b>variables</b>? (ventas, extras, freelance, comisiones...)')+
        '<div class="msg bot"><div class="av">'+OB_AV+'</div><div class="bub"><div class="tool tc">'+
          '<button class="btn btn-primary" data-od-id="onb-var-yes" onclick="obVar(1)">Sí, son variables</button>'+
          '<button class="btn btn-ghost" data-od-id="onb-var-no" onclick="obVar(0)">No, son fijos</button>'+
        '</div></div></div>';
    case 4:
      return obBot('Ahora crea tus <b>categorías de gasto</b>. Ponle nombre, elige un icono y un color, y define cuánto máximo quieres gastar al mes.')+
        '<div class="msg bot"><div class="av">'+OB_AV+'</div><div class="bub"><div class="cat-form">'+
          '<div class="cf-name"><input type="text" id="cfName" maxlength="24" aria-label="Nombre de la categoría"></div>'+
          '<div class="cf-pick"><span class="pv" id="cfIconPv">'+icon(obPick.icon)+'</span><select id="cfIcon" onchange="obPickIcon(this.value)" aria-label="Icono">'+obIconOptions()+'</select></div>'+
          '<div class="cf-pick"><span class="pv sw" id="cfSwPv" style="--c:'+colorOf(obPick.color).a+'"></span><select id="cfColor" onchange="obPickSwat(this.value)" aria-label="Color">'+obColorOptions()+'</select></div>'+
          '<div class="cf-max"><label>Máximo al mes</label><input type="number" id="cfMax" min="0" step="any" value="200" inputmode="decimal"></div>'+
          '<div class="cf-add">'+
            '<button class="btn btn-primary" data-od-id="onb-add-cat" onclick="obAddCat()">Añadir categoría</button>'+
            (state.envelopes.length?'<button class="btn btn-ghost" data-od-id="onb-done-cats" onclick="obFinishCats()">Listo</button>':'')+
          '</div>'+
          (state.envelopes.length?'<div class="chip-row">'+state.envelopes.map(obChip).join('')+'</div>':'')+
        '</div></div></div>';
    case 5:
      return obBot('¡Buen trabajo! Último detalle: <b>¿de qué color</b> quieres la app?')+
        '<div class="msg bot"><div class="av">'+OB_AV+'</div><div class="bub">'+
          '<div class="sw-grid">'+obAppSwatches()+'</div>'+
          (state.colorChosen ? '<div class="cf-add" style="margin-top:14px"><button class="btn btn-primary" data-od-id="onb-done-color" onclick="obGo(6)">Terminado</button></div>' : '')+
        '</div></div>';
    case 6:
      return obBot('¡Bienvenido, <b>'+esc(state.name)+'</b>! Ya tienes <b>'+state.envelopes.length+'</b> sobres listos'+(state.varIncome?' y los <b>ingresos variables</b> activados':'')+'. Cuando cobres, pulsa "Registrar ingreso" y yo repartiré el dinero en tus sobres.')+
        '<div class="msg bot"><div class="av">'+OB_AV+'</div><div class="bub"><div class="tool"><button class="btn btn-primary" data-od-id="onb-finish" onclick="finishOnboarding()">¡Ir a mis sobres!</button></div></div></div>';
  }
  return '';
}

function renderOnboarding(){
  renderTopbar('','');
  var body = '';
  var t = obTranscript();
  for(var i=0;i<t.length;i++) body += t[i];
  body += obPrompt(state.onbStep);
  document.getElementById('view-onboarding').innerHTML =
    '<div class="onb-wrap"><div class="chat">'+
      '<div class="chat-head"><div class="bot-ico">'+OB_AV+'</div><div><div class="tt">Organibot</div><div class="st">Asistente de configuración</div></div></div>'+
      '<div class="chat-body" id="chatBody">'+body+'</div>'+
      '<div class="chat-foot"><span class="demo">¿Con prisa? <b onclick="onbFreqSwap()">Usar ejemplo</b></span></div>'+
    '</div></div>';
  var c = document.getElementById('chatBody');
  c.scrollTop = c.scrollHeight;
  var first = document.querySelector('#view-onboarding input[type=text],#view-onboarding input[type=number]');
  if(first) setTimeout(function(){ try{ first.focus(); }catch(e){} },80);
}

function obGo(step){
  state.onbStep = step;
  state.onbMsgs = obTranscript();
  save();
  renderOnboarding();
}
function obNameDone(){
  var el = document.getElementById('obName');
  var name = el ? el.value.trim() : '';
  if(!name){ toast('Escribe tu nombre'); if(el) el.focus(); return; }
  state.name = name;
  obGo(2);
}
function obFreq(k){ state.freq=k; save(); renderOnboarding(); }
function obSalaryDone(){
  var el = document.getElementById('obIncome');
  var v = parseFloat(el ? el.value : '');
  if(!(v>0) || !isFinite(v)){ toast('Escribe un monto válido'); if(el) el.focus(); return; }
  state.ingresoMensual = Math.round(v*perMonth(state.freq));
  obGo(3);
}
function obVar(ch){
  state.varIncome = !!ch;
  obGo(4);
}
function obIconOptions(){
  var s='';
  for(var i=0;i<ICON_LIB.length;i++){
    s += '<option value="'+ICON_LIB[i].id+'" '+(obPick.icon===ICON_LIB[i].id?'selected':'')+'>'+esc(ICON_N[ICON_LIB[i].id]||ICON_LIB[i].id)+'</option>';
  }
  return s;
}
function obPickIcon(id){
  obPick.icon = id;
  var pv = document.getElementById('cfIconPv');
  if(pv) pv.innerHTML = icon(id);
}
function obColorOptions(){
  var s='';
  for(var i=0;i<COLORS.length;i++){
    s += '<option value="'+COLORS[i].id+'" '+(obPick.color===COLORS[i].id?'selected':'')+'>'+esc(COLORS[i].name)+'</option>';
  }
  return s;
}
function obPickSwat(id){
  obPick.color = id;
  var pv = document.getElementById('cfSwPv');
  if(pv) pv.style.setProperty('--c', colorOf(id).a);
}
function obAddCat(){
  var nameEl = document.getElementById('cfName');
  var maxEl = document.getElementById('cfMax');
  var name = nameEl ? nameEl.value.trim() : '';
  var max = parseFloat(maxEl ? maxEl.value : '');
  if(!name){ toast('Escribe un nombre para la categoría'); if(nameEl) nameEl.focus(); return; }
  if(!(max>0) || !isFinite(max)){ toast('Escribe un monto máximo válido'); if(maxEl) maxEl.focus(); return; }
  var col = colorOf(obPick.color);
  state.envelopes.push({ id:'c'+Date.now(), name:name, icon:obPick.icon, color:col.a, tint:col.soft, on:true, max:Math.round(max), balance:0, txns:[] });
  save();
  renderOnboarding();
}
function obFinishCats(){
  if(!state.envelopes.length){ toast('Añade al menos una categoría'); return; }
  obGo(5);
}
function obDelCat(id){
  for(var i=0;i<state.envelopes.length;i++){ if(state.envelopes[i].id===id){ state.envelopes.splice(i,1); break; } }
  save();
  renderOnboarding();
}
function obChip(e){
  var ec = envColor(e);
  return '<span class="chip"><i style="--c:'+ec.c+'"></i>'+esc(envName(e))+' · <b>'+fmt(e.max)+'</b><button onclick="obDelCat(\''+e.id+'\')" aria-label="Quitar '+esc(envName(e))+'">×</button></span>';
}
function obAppSwatches(){
  var s='';
  for(var i=0;i<COLORS.length;i++){
    var c=COLORS[i];
    s += '<button class="sw'+(state.appColor===c.id?' on':'')+'" style="--c:'+c.a+'" data-od-id="onb-color-'+c.id+'" onclick="obAppColor(\''+c.id+'\')"><i></i><span>'+esc(c.name)+'</span></button>';
  }
  return s;
}
function obAppColor(id){
  state.appColor = id;
  state.colorChosen = true;
  applyAppColor();
  save();
  renderOnboarding();
}
function onbFreqSwap(){ state=buildDemo(); save(); go('dashboard'); toast('Datos de ejemplo cargados'); }
function finishOnboarding(){
  if(!(state.ingresoMensual>0)){ toast('Primero escribe tu ingreso'); return; }
  if(!state.envelopes.length){ toast('Añade al menos una categoría'); return; }
  state.envelopes.forEach(function(e){ e.balance=0; e.txns=[]; });
  state.received = 0;
  state.onbStep = 0;
  state.onbMsgs = [];
  state.colorChosen = false;
  state.view = 'dashboard';
  save();
  go('dashboard');
  toast('Sobres creados · reparte tu ingreso cuando llegue');
}

/* ---------------- Utils ---------------- */

function getEnv(id){ for(var i=0;i<state.envelopes.length;i++){ if(state.envelopes[i].id===id) return state.envelopes[i]; } return null; }

var toastTimer=null;
function toast(msg){
  var el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ el.classList.remove('show'); },2600);
}

/* ---------------- Boot ---------------- */

document.getElementById('scrim').addEventListener('click', function(){
  if(!document.getElementById('modal').hidden) closeVarModal();
  else closeDrawer();
});
document.querySelectorAll('.nav a').forEach(function(a){
  a.addEventListener('click', function(ev){ ev.preventDefault(); go(a.getAttribute('data-nav')); });
});
document.addEventListener('keydown', function(ev){
  if(ev.key==='Escape'){
    if(!document.getElementById('modal').hidden) closeVarModal();
    else closeDrawer();
  }
});

applyAppColor();
renderSidebarFoot();
go(state.view);
</script>
</body>
</html>
